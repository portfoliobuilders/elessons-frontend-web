name: gtec_app
description: "G-TEC Education — Class 8–12 CBSE tuition platform (Flutter mobile app)."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

  # Plus Jakarta Sans + JetBrains Mono are fetched and cached at runtime by
  # google_fonts, matching the design's typography without bundling binaries.
  google_fonts: ^6.2.1

  # Lottie animation support for authentication screen.
  lottie: ^3.1.2

  # iOS-style glyphs used for some Cupertino fallbacks.
  cupertino_icons: ^1.0.8

  # ── Backend integration ──────────────────────────────────────────────
  # State management across every module (AuthProvider, CartProvider, …).
  provider: ^6.1.2
  # HTTP networking — the ONLY networking package, per the integration spec.
  http: ^1.2.2
  # Local persistence for the JWT session, user snapshot and UI preferences.
  shared_preferences: ^2.3.2
  # Opens the Stripe Checkout URL (and other external links) in the browser.
  url_launcher: ^6.3.1
  google_sign_in: ^6.2.1
  # Embedded YouTube video player for lesson playback across Web, Android, iOS.
  youtube_player_iframe: ^5.2.1
  # Mobile hardware screen recording and screenshot prevention.
  screen_protector: ^1.4.1
  # Razorpay SDK for Indian payments (UPI, Cards, Netbanking, Wallets).
  razorpay_flutter: ^1.3.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Asset slots are reserved for real artwork/icons. Until those are added, the
  # UI renders procedural placeholders (see HatchTile / HatchPainter), so the
  # app builds and runs with no missing-asset errors.
  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
