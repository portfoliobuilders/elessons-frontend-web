<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="G-TEC Education — Class 8–12 CBSE tuition platform.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="G-TEC Education">

  <title>G-TEC Education</title>
  <link rel="manifest" href="manifest.json">

  <!-- Razorpay Checkout Web SDK -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <style>
    /* Security & Anti-Extract CSS Rules for Flutter Web */
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #0E1424;
      -webkit-user-select: none !important;
      -moz-user-select: none !important;
      -ms-user-select: none !important;
      user-select: none !important;
      -webkit-user-drag: none !important;
      user-drag: none !important;
      -webkit-touch-callout: none !important;
    }
  </style>

  <script>
    // Security Script: Block right-click / contextmenu & Dragging globally on Web DOM
    document.addEventListener('contextmenu', function(e) {
      e.preventDefault();
      e.stopPropagation();
      return false;
    }, true);

    document.addEventListener('dragstart', function(e) {
      e.preventDefault();
      return false;
    }, true);
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
