<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CBSE (NCERT) Grade 9 — List of Video Classes | eLessons.net</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   Video-class list — print template.
   Reproduces the layout of the existing PDF handout, but generated from
   course-data.js so the handout can never drift from the website.
   "Download PDF" = window.print() -> Save as PDF. No PDF library needed,
   which keeps the page weight at zero and the output selectable/searchable.
   ========================================================================== */
:root { --ink:#111; --rule:#C9C9C9; --hl:#FDE9A9; --hl-rule:#E8C34A; }

* { box-sizing: border-box; }
body {
  margin: 0; background: #6E7583;
  font-family: "Plus Jakarta Sans", Calibri, Arial, sans-serif;
  color: var(--ink); font-size: 11pt;
}

.toolbar {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 14px 22px; background: #0E2A52; color: #fff;
}
.toolbar p { margin: 0; font-size: 13px; color: rgba(255,255,255,.72); }
.toolbar button {
  font: inherit; font-weight: 700; font-size: 14px; cursor: pointer;
  border: 0; border-radius: 999px; padding: 11px 20px;
  background: #E3A82B; color: #081D3A;
}
.toolbar button:hover { background: #d19a22; }
.toolbar a { color: #fff; font-size: 13px; font-weight: 700; margin-left: auto; }

/* One .sheet = one A4 page */
.sheet {
  width: 210mm; min-height: 297mm; margin: 22px auto; padding: 16mm 14mm;
  background: #fff; box-shadow: 0 6px 22px rgba(0,0,0,.28);
  page-break-after: always; position: relative;
}
.sheet:last-child { page-break-after: auto; }

.sheet__head { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 12mm; }
.logo { line-height: 1; }
.logo b { font-size: 27pt; font-weight: 700; letter-spacing: -.02em; }
.logo b i { font-style: normal; color: #29ABE2; }
.logo span { display: block; font-size: 8pt; color: #7A7A7A; letter-spacing: .04em; margin-top: 2px; padding-left: 30px; }
.pageno { font-size: 10.5pt; }
.pageno b { font-weight: 700; }

.banner {
  background: var(--hl); text-align: center; font-weight: 700;
  font-size: 13pt; padding: 7px 10px; margin-bottom: 8mm;
}
.stream { text-align: center; font-weight: 700; font-size: 13pt; text-decoration: underline; margin-bottom: 6mm; }

table { border-collapse: collapse; width: 100%; }
.summary { width: 62%; margin: 0 auto 9mm; }
.summary th, .summary td { border: 1px solid var(--hl-rule); padding: 4px 9px; font-size: 11pt; background: var(--hl); }
.summary th { font-weight: 700; }
.summary td:last-child, .summary th:last-child { text-align: center; }
.summary tr.total td { font-weight: 700; }

h2.tbl-title { font-size: 11pt; font-weight: 700; margin: 0 0 4mm; }

.classes { table-layout: fixed; }
.classes th, .classes td {
  border: 1px solid var(--rule); padding: 3px 8px;
  font-size: 10.5pt; vertical-align: top; line-height: 1.32;
}
.classes th { font-weight: 700; text-align: left; }
.classes col.c1 { width: 36%; }
.classes td.chap { font-weight: 400; }
.classes td.rowspan-cell { border-bottom-color: var(--rule); }

.note { font-size: 10pt; margin-top: 4mm; }

@page { size: A4; margin: 12mm; }
@media print {
  body { background: #fff; }
  .toolbar { display: none; }
  .sheet { width: auto; min-height: 0; margin: 0; padding: 0; box-shadow: none; }
}
</style>
</head>
<body>

<div class="toolbar">
  <button onclick="window.print()">Download as PDF</button>
  <p>Opens your browser's print dialog — choose <strong>Save as PDF</strong>. Output is A4 and text stays selectable.</p>
  <a href="course-detail.html">&larr; Back to the course</a>
</div>

<div id="sheets"></div>

<script src="course-data.js"></script>
<script>
(function () {
  var D = window.ELESSONS;
  var SUBJECTS = ["Mathematics", "Physics", "Chemistry", "Biology", "English Grammar"];
  var GRADE = 9;
  var ROWS_PER_PAGE = 30;          // tuned so a table fills an A4 page without spilling

  function live(sub) {
    return D.syllabus[sub].map(function (ch) {
      return { name: ch.name, videos: ch.videos.filter(function (v) { return v.status === "live"; }) };
    }).filter(function (ch) { return ch.videos.length; });
  }

  /* Flatten to printable rows, keeping the chapter name on its first row only
     (this is how the original handout reads). */
  function rowsFor(sub) {
    var out = [];
    live(sub).forEach(function (ch) {
      ch.videos.forEach(function (v, i) {
        out.push({ chapter: i === 0 ? ch.name : "", video: v.t, span: i === 0 ? ch.videos.length : 0 });
      });
    });
    return out;
  }

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  /* Build the page list first so "Page X of Y" is correct before rendering. */
  var pages = [];
  pages.push({ type: "cover" });
  SUBJECTS.forEach(function (sub) {
    var rows = rowsFor(sub);
    for (var i = 0; i < rows.length; i += ROWS_PER_PAGE) {
      pages.push({ type: "table", subject: sub, rows: rows.slice(i, i + ROWS_PER_PAGE), first: i === 0 });
    }
  });

  var TOTAL = pages.length;

  function head(n) {
    return '<div class="sheet__head">' +
      '<div class="logo"><b><i>e</i>lessons.net</b><span>Your Virtual Classroom</span></div>' +
      '<div class="pageno">Page <b>' + n + "</b> of <b>" + TOTAL + "</b></div></div>";
  }

  function coverHTML() {
    var grand = 0;
    var body = SUBJECTS.map(function (s) {
      var n = D.countLive(s);
      grand += n;
      return "<tr><td>" + esc(s) + "</td><td>" + n + "</td></tr>";
    }).join("");
    return '<div class="banner">CBSE (NCERT) GRADE ' + GRADE + " - LIST OF VIDEO CLASSES</div>" +
      '<div class="stream">PCMB</div>' +
      '<table class="summary"><thead><tr><th>Subject</th><th>Number of Videos</th></tr></thead>' +
      "<tbody>" + body + '<tr class="total"><td>Total</td><td>' + grand + "</td></tr></tbody></table>" +
      '<p class="note">*English Grammar is offered complimentary with the Annual Pack.</p>';
  }

  function tableHTML(p) {
    var title = p.first
      ? '<h2 class="tbl-title">CBSE GRADE-' + GRADE + " (" + p.subject.toUpperCase() + ") TABLE OF VIDEO CLASSES</h2>"
      : '<h2 class="tbl-title">CBSE GRADE-' + GRADE + " (" + p.subject.toUpperCase() + ") — continued</h2>";

    var body = p.rows.map(function (r) {
      return "<tr><td class=\"chap\">" + esc(r.chapter) + "</td><td>" + esc(r.video) + "</td></tr>";
    }).join("");

    return title +
      '<table class="classes"><colgroup><col class="c1"><col></colgroup>' +
      "<thead><tr><th>CHAPTER NAME</th><th>VIDEO NAME</th></tr></thead>" +
      "<tbody>" + body + "</tbody></table>";
  }

  document.getElementById("sheets").innerHTML = pages.map(function (p, i) {
    return '<section class="sheet">' + head(i + 1) +
      (p.type === "cover" ? coverHTML() : tableHTML(p)) + "</section>";
  }).join("");

  document.title = "CBSE (NCERT) Grade " + GRADE + " — List of Video Classes";
})();
</script>
</body>
</html>
