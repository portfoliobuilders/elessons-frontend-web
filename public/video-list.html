<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CBSE (NCERT) Grade 9 — List of Video Classes | eLessons.net</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* Standalone on purpose: this document is printed and emailed on its own,
     so it must render correctly even when the site CSS is not loaded. */
  :root {
    /* tokens matched to indexnew.html */
    --ink: #001A4E; --line: #CBD5E1; --amber: #FBC63F; --amber-soft: #FEF3D4;
    --blue: #1552A0; --muted: #64748B; --navy: #0A3170; --mist: #F8FAFC;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 28px 20px 60px;
    font-family: 'Plus Jakarta Sans', -apple-system, 'Segoe UI', sans-serif;
    color: var(--ink); background: #EEF1F6; font-size: 14px; line-height: 1.5;
  }
  .sheet {
    max-width: 900px; margin: 0 auto; background: #fff; padding: 42px 46px 56px;
    box-shadow: 0 10px 40px rgba(11,31,63,.12); border-radius: 6px;
  }

  .doc-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 26px; }
  .logo { font-size: 30px; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
  .logo span { color: var(--blue); }
  .logo small { font-family:'JetBrains Mono',monospace; }
  .logo small { display: block; font-size: 10px; font-weight: 500; letter-spacing: .16em; color: #8A93A3; text-transform: uppercase; margin-top: 3px; }

  h1 {
    background: var(--amber); margin: 0 0 22px; padding: 11px 16px;
    font-size: 17px; font-weight: 700; text-align: center; letter-spacing: .01em;
  }
  h2 { font-size: 20px; text-align: center; margin: 0 0 18px; text-decoration: underline; text-underline-offset: 4px; }
  h3 { font-size: 13px; font-weight: 700; margin: 34px 0 10px; letter-spacing: .09em;
       font-family:'JetBrains Mono',monospace; text-transform: uppercase; }

  table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  th, td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
  thead th { background: var(--amber-soft); font-weight: 700; }
  .summary { width: 62%; margin: 0 auto 8px; }
  .summary th, .summary td { text-align: left; }
  .summary tbody th { background: var(--amber); font-weight: 600; }
  .summary tbody td { background: var(--amber-soft); text-align: center; width: 40%; }
  .summary tfoot th, .summary tfoot td { background: var(--amber); font-weight: 700; text-align: center; }
  .summary tfoot th { text-align: left; }

  td.chapter { font-weight: 600; background: #FAFBFD; width: 34%; }
  .note { font-size: 11.5px; color: var(--muted); margin-top: 14px; }
  .withheld td { color: #98A0AE; font-style: italic; }

  .bar {
    max-width: 900px; margin: 0 auto 18px; display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap;
  }
  .bar button, .bar a {
    font-family: inherit; font-size: 13px; font-weight: 600; padding: 10px 18px;
    border-radius: 999px; border: 1.5px solid #D5DBE6; background: #fff; color: var(--ink);
    cursor: pointer; text-decoration: none;
  }
  .bar button.primary { background: var(--navy); border-color: var(--navy); color: #fff; }
  .bar button:hover { border-color: var(--navy); }

  @media print {
    @page { size: A4 portrait; margin: 15mm 13mm; }
    body { background: #fff; padding: 0; font-size: 10.5pt; }
    .sheet { box-shadow: none; max-width: none; padding: 0; border-radius: 0; }
    .bar { display: none !important; }
    thead { display: table-header-group; }   /* repeat headers on every page */
    tr { break-inside: avoid; }
    h3 { break-after: avoid; }
    h1, h2 { break-after: avoid; }
  }
  @media (max-width: 640px) {
    body { padding: 14px 10px 40px; }
    .sheet { padding: 22px 16px 32px; }
    .summary { width: 100%; }
    table { font-size: 11.5px; }
  }
</style>
</head>
<body>

<div class="bar">
  <a href="course-detail.html?grade=9&amp;plan=full">&larr; Back to the course</a>
  <button type="button" class="primary" onclick="window.print()">Print / Save as PDF</button>
</div>

<div class="sheet">
  <div class="doc-head">
    <div class="logo"><span>e</span>lessons.net<small>Your Virtual Classroom</small></div>
  </div>

  <h1>CBSE (NCERT) GRADE 9 &ndash; LIST OF VIDEO CLASSES</h1>
  <h2>PCMB</h2>

  <table class="summary">
    <thead><tr><th>Subject</th><th>Number of Videos</th></tr></thead>
    <tbody id="summary-body"></tbody>
    <tfoot><tr><th>Total</th><td id="summary-total"></td></tr></tfoot>
  </table>

  <div id="tables"></div>

  <p class="note" id="footnote">
    English Grammar is offered as complimentary along with the Annual Pack.
  </p>
</div>

<script src="assets/js/course-data.js"></script>
<script>
(function () {
  var ORDER = ['maths', 'physics', 'chemistry', 'biology', 'english'];
  var HEADING = {
    maths:     'CBSE GRADE-9 (MATHEMATICS) TABLE OF VIDEO CLASSES',
    physics:   'CBSE GRADE-9 (PHYSICS) TABLE OF VIDEO CLASSES',
    chemistry: 'CBSE GRADE-9 (CHEMISTRY) TABLE OF VIDEO CLASSES',
    biology:   'CBSE GRADE-9 (BIOLOGY) TABLE OF VIDEO CLASSES',
    english:   'ENGLISH GRAMMAR (COMPLIMENTARY) TABLE OF VIDEO CLASSES'
  };

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // ---- summary table ----
  var sBody = document.getElementById('summary-body');
  sBody.innerHTML = ORDER.map(function (k) {
    return '<tr><th>' + esc(STREAM_META[k].label) + '</th><td>' + streamCount(k) + '</td></tr>';
  }).join('');
  document.getElementById('summary-total').textContent = registerTotal();

  // ---- per-subject tables, chapter names merged with rowspan ----
  document.getElementById('tables').innerHTML = ORDER.map(function (k) {
    var rows = REGISTER_9[k].map(function (ch) {
      var lessons = publishedLessons(ch);
      if (!lessons.length) return '';
      return lessons.map(function (l, i) {
        var title = typeof l === 'string' ? l : l.t;
        var cell = i === 0
          ? '<td class="chapter" rowspan="' + lessons.length + '">' + esc(ch.c) + '</td>'
          : '';
        return '<tr>' + cell + '<td>' + esc(title) + '</td></tr>';
      }).join('');
    }).join('');

    return '<h3>' + esc(HEADING[k]) + '</h3>' +
      '<table><thead><tr><th>CHAPTER NAME</th><th>VIDEO NAME</th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table>';
  }).join('');
})();
</script>
</body>
</html>
